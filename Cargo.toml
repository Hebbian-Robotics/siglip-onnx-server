[package]
name = "siglip-onnx-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "CPU-only, text-only SigLIP embedding server backed by ONNX Runtime"
repository = "https://github.com/Hebbian-Robotics/siglip-onnx-server"
readme = "README.md"
keywords = ["siglip", "onnx", "embeddings", "inference"]
categories = ["web-programming::http-server", "science"]

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
base64 = "0.22.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "ndarray", "load-dynamic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokenizers = "0.23.1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
